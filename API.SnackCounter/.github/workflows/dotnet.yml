name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore API.SnackCounter.slnx

      - name: Build
        run: dotnet build API.SnackCounter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test API.SnackCounter.slnx --configuration Release --no-build --verbosity normal
